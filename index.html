<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>25:00</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <noscript><p class="noscript">這個計時需要 JavaScript。</p></noscript>
    <main class="dock">
      <button type="button" class="card-toggle" id="card-toggle" aria-expanded="false" aria-controls="card-shell">
        展開
      </button>
      <div class="card-shell" id="card-shell">
        <section class="card">
          <header class="card-top">
            <div class="lang" role="group" aria-label="語言">
              <button type="button" id="lang-zh" aria-pressed="true">中</button>
              <button type="button" id="lang-en" aria-pressed="false">EN</button>
            </div>
          </header>
          <p class="cheer is-zh" id="cheer"></p>
          <p class="clock" id="clock">25:00</p>
          <p class="status" id="status"></p>
          <div class="presets" id="presets" role="group" aria-label="時長"></div>
          <div class="actions">
            <button type="button" class="primary" id="primary">開始</button>
          </div>
          <p class="hint" id="hint">雙擊看山，換一句鼓勵</p>
        </section>
      </div>
      <div class="pet-rig" id="pet" aria-label="劉看山。雙擊可換一句鼓勵。">
        <div class="pet-stage">
          <img class="pet-img" src="./poses/idle.webp" alt="" draggable="false" />
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
