<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>氣脈陪練</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <noscript><p class="noscript">這個計時需要 JavaScript。</p></noscript>
    <main class="dock">
      <section class="card" aria-labelledby="app-title">
        <header class="card-top">
          <h1 id="app-title">氣脈陪練</h1>
          <div class="lang" role="group" aria-label="語言">
            <button type="button" id="lang-zh" aria-pressed="true">中</button>
            <button type="button" id="lang-en" aria-pressed="false">EN</button>
          </div>
        </header>
        <p class="clock" id="clock">25:00</p>
        <p class="status" id="status"></p>
        <div class="presets" id="presets" role="group" aria-label="時長"></div>
        <div class="actions">
          <button type="button" class="primary" id="primary">開始</button>
        </div>
        <p class="hint" id="hint">雙擊看山，立刻提醒</p>
      </section>
      <p class="bubble" id="bubble" role="status" aria-live="polite">
        <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2.2a6.2 6.2 0 0 0-3.3 11.4c.5.4.8 1 .8 1.6v.6h5v-.6c0-.6.3-1.2.8-1.6A6.2 6.2 0 0 0 12 2.2Z"/>
          <rect x="9.2" y="17" width="5.6" height="1.5" rx="0.6" fill="currentColor"/>
          <rect x="9.6" y="19.2" width="4.8" height="1.5" rx="0.6" fill="currentColor"/>
        </svg>
        <span id="bubble-text"></span>
      </p>
      <div class="pet-rig" id="pet" aria-label="劉看山。雙擊可立刻提醒。">
        <div class="pet-stage">
          <img class="pet-img is-on" src="./poses/idle-stand.svg" alt="" draggable="false" />
          <img class="pet-img" alt="" draggable="false" />
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
