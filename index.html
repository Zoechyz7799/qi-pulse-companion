<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>25:00</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <noscript><p class="noscript">這個計時需要 JavaScript。</p></noscript>
    <main class="dock">
      <p class="encourage" id="encourage" role="status" aria-live="polite" aria-hidden="true">
        <span id="encourage-text"></span>
      </p>
      <section class="card">
        <header class="card-top">
          <div class="lang" role="group" aria-label="語言">
            <button type="button" id="lang-zh" aria-pressed="true">中</button>
            <button type="button" id="lang-en" aria-pressed="false">EN</button>
          </div>
        </header>
        <p class="clock" id="clock">25:00</p>
        <p class="status" id="status"></p>
        <div class="presets" id="presets" role="group" aria-label="時長"></div>
        <div class="actions">
          <button type="button" class="primary" id="primary">開始</button>
        </div>
        <p class="hint" id="hint">雙擊看山，立刻提醒</p>
      </section>
      <div class="pet-rig" id="pet" aria-label="劉看山。雙擊可立刻提醒。">
        <div class="pet-stage">
          <img class="pet-img is-on" src="./poses/idle-stand.svg" alt="" draggable="false" />
          <img class="pet-img" alt="" draggable="false" />
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
